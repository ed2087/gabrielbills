<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculadora de Facturas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      padding: 20px;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.5em;
    }

    h2 {
      color: #333;
      margin-top: 20px;
      margin-bottom: 15px;
      font-size: 1.2em;
    }

    h3 {
      color: #555;
      margin-top: 15px;
      margin-bottom: 10px;
      font-size: 1em;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .due-date {
      font-size: 0.85em;
      color: #777;
      margin-bottom: 15px;
    }

    .result-item {
      margin-bottom: 10px;
      background-color: rgba(0, 123, 255, 0.1);
      padding: 12px;
      border-radius: 5px;
    }

    .result-item p {
      margin: 0;
      font-size: 1em;
    }

    .input-section {
      margin-bottom: 20px;
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 15px;
      }

      h1 {
        font-size: 1.3em;
      }

      input {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="input-section">
      <h1>Calculadora de Facturas</h1>

      <label for="electricity">Factura de Electricidad:</label>
      <input type="number" id="electricity" step="0.01" placeholder="0.00" />
      <p class="due-date">Vence antes del 25 de cada mes</p>

      <label for="water">Factura de Agua:</label>
      <input type="number" id="water" step="0.01" placeholder="0.00" />
      <p class="due-date">Vence antes del 14 de cada mes</p>

      <label for="gas">Factura de Gas:</label>
      <input type="number" id="gas" step="0.01" placeholder="0.00" />
      <p class="due-date">Vence antes del 25 de cada mes</p>
    </div>

    <div class="result-section">
      <h2>Resultados</h2>
      <div class="result-item">
        <p id="brother-share"><strong>Tu parte a pagar:</strong> $0.00</p>
      </div>
      <div class="result-item">
        <p id="main-house-share"><strong>Parte de la casa principal:</strong> $0.00</p>
      </div>

      <h3>Tu Desglose</h3>
      <div class="result-item">
        <p id="brother-electricity">Electricidad: $0.00</p>
      </div>
      <div class="result-item">
        <p id="brother-water">Agua: $0.00</p>
      </div>
      <div class="result-item">
        <p id="brother-gas">Gas: $0.00</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
